<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Приглашение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #fffdf5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 320px; /* Ключевое изменение: жёсткий лимит ширины */
      padding: 12px;
      box-sizing: border-box;
      text-align: center;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
    }

    h1 {
      color: #d32f2f;
      font-size: 16px;
      line-height: 1.2;
      margin: 0 0 10px;
      font-weight: 700;
    }

    p {
      color: #555;
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 16px;
    }

    .buttons-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:active {
      background-color: #b71c1c;
    }

    @media (max-width: 300px) {
      h1 { font-size: 14px; }
      p { font-size: 12px; }
      button { padding: 10px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d32f2f'%3E%3Cpath d='M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/%3E%3C/svg%3E" alt="Письмо" class="header-icon" />
    
    <h1>Приглашение на свидание</h1>
    <p>Ты — самое дорогое, что у меня есть. Хочу провести с тобой незабываемый вечер.</p>

    <div class="buttons-group">
      <button id="btn-agree">Я согласна</button>
      <button id="btn-strong-agree">Я точно согласна</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    function sendChoice(choice) {
      tg.sendData(JSON.stringify({ type: 'invitation_response', choice: choice }));
    }

    document.getElementById('btn-agree').addEventListener('click', () => sendChoice('agree'));
    document.getElementById('btn-strong-agree').addEventListener('click', () => sendChoice('strong_agree'));
  </script>
</body>
</html>
