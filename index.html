<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Приглашение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #fffdf5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      box-sizing: border-box;
      text-align: center;
    }

    .header-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;
    }

    h1 {
      color: #d32f2f;
      font-size: 16px;
      line-height: 1.2;
      margin: 0 0 10px;
      font-weight: 700;
    }

    p {
      color: #555;
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 16px;
    }

    .buttons-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #d32f2f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:active {
      background-color: #b71c1c;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 300px) {
      h1 { font-size: 14px; }
      p { font-size: 12px; }
      button { padding: 10px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <!-- Страница 1: Приглашение -->
  <div class="container" id="page-1">
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23d32f2f'%3E%3Cpath d='M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z'/%3E%3C/svg%3E" alt="Письмо" class="header-icon" />
    <h1>Приглашение на свидание</h1>
    <p>Ты — самое дорогое, что у меня есть. Хочу провести с тобой незабываемый вечер.</p>
    <div class="buttons-group">
      <button id="btn-agree">Я согласна</button>
      <button id="btn-strong-agree">Я точно согласна</button>
    </div>
  </div>

  <!-- Страница 2: Выбор места -->
  <div class="container hidden" id="page-2">
    <h1>Куда пойдём?</h1>
    <p>Выбери, что тебе больше нравится 😊</p>
    <div class="buttons-group">
      <button class="btn-place" data-place="restaurant">Ресторан 🍽️</button>
      <button class="btn-place" data-place="cinema">Кино 🎬</button>
      <button class="btn-place" data-place="walk">Прогулка 🌅</button>
    </div>
  </div>

  <!-- Страница 3: Финал -->
  <div class="container hidden" id="page-3">
    <h1 id="final-title">Ура! 🎉</h1>
    <p id="final-text">Всё запланировано! Жду тебя.</p>
    <button onclick="tg.close()" style="background-color: #1976D2;">Закрыть</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Получаем ID пользователя Telegram
    const userId = tg.initDataUnsafe?.user?.id || null;

    // Универсальная функция отправки на сервер
    async function sendToServer(payload) {
      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, user_id: userId })
        });
        return await response.json();
      } catch (e) {
        console.error('Ошибка отправки:', e);
      }
    }

    // Переход между страницами
    function showPage(pageId) {
      document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));
      document.getElementById(pageId).classList.remove('hidden');
    }

    // Кнопки страницы 1
    document.getElementById('btn-agree').addEventListener('click', async () => {
      await sendToServer({ step: 'invitation', choice: 'agree' });
      showPage('page-2');
    });

    document.getElementById('btn-strong-agree').addEventListener('click', async () => {
      await sendToServer({ step: 'invitation', choice: 'strong_agree' });
      showPage('page-2');
    });

    // Кнопки страницы 2
    document.querySelectorAll('.btn-place').forEach(btn => {
      btn.addEventListener('click', async () => {
        const place = btn.dataset.place;
        await sendToServer({ step: 'place', choice: place });

        const placeNames = {
          restaurant: 'Ресторан 🍽️',
          cinema: 'Кино 🎬',
          walk: 'Прогулка 🌅'
        };

        document.getElementById('final-text').innerText =
          `Отлично! ${placeNames[place]} — прекрасный выбор. Жду тебя!`;
        showPage('page-3');
      });
    });
  </script>
</body>
</html>
